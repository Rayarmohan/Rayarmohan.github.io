<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfolio of Rayar Mohan, Mobile App Developer specializing in Flutter.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rayar Mohan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rayar Mohan</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      overflow: hidden;
    }

    /* ── Splash wrapper ───────────────────────────── */
    #flutter-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #0c1320 0%, #05070b 55%, #000000 100%);
      opacity: 1;
      transition: opacity 0.55s ease;
    }

    /* ── Dot-grid backdrop (faded toward the edges) ─ */
    #flutter-loading::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 38px 38px;
      -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
      mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
      pointer-events: none;
    }

    .splash {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ── Emblem ───────────────────────────────────── */
    .mark {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: markIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      will-change: transform, opacity;
    }

    @keyframes markIn {
      from { opacity: 0; transform: scale(0.86); }
      to   { opacity: 1; transform: scale(1); }
    }

    .mark::before {
      content: '';
      position: absolute;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(79, 209, 197, 0.20) 0%,
        rgba(124, 156, 255, 0.10) 42%,
        transparent 70%
      );
      animation: glowPulse 3s ease-in-out infinite;
      will-change: opacity;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }

    .ring-track {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.07);
    }

    .spinner {
      position: absolute;
      width: 150px;
      height: 150px;
      animation: spin 1.7s linear infinite;
      will-change: transform;
    }

    .spinner svg { width: 100%; height: 100%; display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .monogram {
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2px;
      padding-left: 2px;
      background: linear-gradient(135deg, #4FD1C5, #ffffff 50%, #7C9CFF);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* ── Name & role ──────────────────────────────── */
    .splash-name {
      margin-top: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 8px;
      text-indent: 8px;
      background: linear-gradient(90deg, #7C9CFF, #ffffff 50%, #4FD1C5);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
      will-change: transform, opacity;
    }

    .splash-role {
      margin-top: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: 5px;
      text-indent: 5px;
      text-transform: uppercase;
      color: #6b7280;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.40s forwards;
      will-change: transform, opacity;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Indeterminate progress ───────────────────── */
    .bar-track {
      position: relative;
      margin-top: 26px;
      width: 180px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.07);
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
    }

    .bar-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(
        90deg,
        rgba(79, 209, 197, 0) 0%,
        #4FD1C5 35%,
        #7C9CFF 65%,
        rgba(124, 156, 255, 0) 100%
      );
      box-shadow: 0 0 10px rgba(79, 209, 197, 0.55);
      transform: translateX(-110%);
      animation: sweep 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      will-change: transform;
    }

    @keyframes sweep {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(255%); }
    }

    /* ── Accessibility: reduce motion ─────────────── */
    @media (prefers-reduced-motion: reduce) {
      .spinner,
      .mark::before,
      .bar-glow {
        animation: none !important;
      }
      .mark,
      .splash-name,
      .splash-role,
      .bar-track {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .bar-glow { transform: translateX(60%); opacity: 0.85; }
    }
  </style>
</head>

<body>
  <!-- ── Custom splash (shows instantly, before Flutter boots) ── -->
  <div id="flutter-loading">
    <div class="splash">
      <div class="mark">
        <div class="ring-track"></div>
        <div class="spinner">
          <svg viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="spinGrad" x1="18" y1="12" x2="132" y2="138" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4FD1C5"/>
                <stop offset="0.5" stop-color="#7C9CFF"/>
                <stop offset="1" stop-color="#C792EA"/>
              </linearGradient>
            </defs>
            <circle
              cx="75"
              cy="75"
              r="72"
              stroke="url(#spinGrad)"
              stroke-width="3"
              stroke-linecap="round"
              stroke-dasharray="130 322.4"
            />
          </svg>
        </div>
        <div class="monogram">RM</div>
      </div>

      <div class="splash-name">RAYAR MOHAN</div>
      <div class="splash-role">Mobile App Developer</div>

      <div class="bar-track">
        <div class="bar-glow"></div>
      </div>
    </div>
  </div>

  <!-- ── Flutter bootstrap ───────────────────────────────────── -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Fade out the HTML splash the moment Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      const el = document.getElementById('flutter-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () {
        el.style.display = 'none';
      }, 580); // matches the 0.55s CSS transition + small buffer
    });
  </script>
</body>
</html>
